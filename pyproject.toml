[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "purdue-brightspace-mcp"
version = "0.1.0"
description = "Read-only MCP server for a student's own Purdue Brightspace data, designed around Purdue IT, data-classification and AI-use policy."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.17",
    "httpx>=0.27",
    "keyring>=25",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
web = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "pypdf>=4",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "purdue-brightspace-mcp[web]"]

[project.scripts]
purdue-brightspace-mcp = "purdue_brightspace_mcp.server:main"
study-deck = "study_deck.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/purdue_brightspace_mcp", "src/study_deck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
