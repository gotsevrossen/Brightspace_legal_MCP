[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "purdue-brightspace-mcp"
version = "0.1.0"
description = "Read-only MCP server for a student's own Purdue Brightspace data, designed around Purdue IT, data-classification and AI-use policy."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.17",
    "httpx>=0.27",
    "keyring>=25",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
purdue-brightspace-mcp = "purdue_brightspace_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/purdue_brightspace_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
